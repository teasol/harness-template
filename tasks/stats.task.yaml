task:
  id: stats
  plan: demo-pipeline
  title: Compute summary statistics
  depends_on:
  - data-gen
  brief: |
    Implement `src/demo_pipeline/stats.py` as a runnable module:

    - `python -m demo_pipeline.stats --input CSV --out JSON`
    - Read the CSV (header `x,y`); raise ValueError on any other header.
    - Compute n, means, population std/mean, and the least-squares line
      y = slope*x + intercept. Round all floats to 6 decimals.
    - Write pretty-printed JSON to --out; create parent dirs.
    - Exit code 0 on success.

    Consume the data-gen module only through its contract (a CSV path).
    Do not reimplement dataset generation in your acceptance; call the
    dependency's CLI. Do not implement or modify any other module.
  contract:
    inputs:
    - name: dataset
      type: path
      description: CSV with header `x,y` (output of the data-gen module)
    outputs:
    - name: stats
      type: json
      description: |
        JSON with keys n, x_mean, y_mean, x_std, y_std, slope, intercept (least-squares fit of y on x)
  deliverables:
  - src/demo_pipeline/stats.py
  constraints:
  - stdlib only
  - must not import demo_pipeline.data_gen (contract-level reuse only)
  acceptance:
    steps:
    - id: prepare-input
      run: ${HARNESS_PYTHON} -m demo_pipeline.data_gen --out "${HARNESS_RESULTS_DIR}/demo_data.csv"
        --seed 42
      timeout: 120
    - id: run-stats
      run: ${HARNESS_PYTHON} -m demo_pipeline.stats --input "${HARNESS_RESULTS_DIR}/demo_data.csv"
        --out "${HARNESS_RESULTS_DIR}/stats.json"
      timeout: 120
      checks:
      - type: file_exists
        path: ${HARNESS_RESULTS_DIR}/stats.json
      - type: json_metric
        path: ${HARNESS_RESULTS_DIR}/stats.json
        metric: n
        equals: 100
      - type: json_metric
        path: ${HARNESS_RESULTS_DIR}/stats.json
        metric: x_mean
        min: 45
        max: 50
      - type: json_metric
        path: ${HARNESS_RESULTS_DIR}/stats.json
        metric: slope
        min: 1.9
        max: 2.1
  status: done
  worker: demo-worker-b
  log:
  - 2026-08-28T08:53:52Z claimed by demo-worker-b
  - 2026-08-28T08:53:52Z acceptance passed (2 step(s)) — done
  - 2026-08-28T13:22:56Z re-materialized from plan 'demo-pipeline' (--force)
