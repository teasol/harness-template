# Example orchestration plan fixture for unit tests.
#
# Every command here writes a real file and exits 0, because the tests assert on
# the verdict the harness reaches — not on anything the commands mean. What a
# checklist item asserts is the project's business; that an item's exit code
# decides it is the harness's, and that is what this fixture exercises.
plan:
  name: demo-pipeline
  goal: >
    Build a deterministic stats pipeline: generate a seeded dataset, then
    compute summary statistics from it, and verify the assembled flow.
  description: >
    Two-module example demonstrating the two-tier harness.

  report:
    question: |
      Does the seeded pipeline recover the generating line (slope 2, intercept 1)
      from 100 samples, deterministically?
    metrics:
      - name: sample_count
        source: ${HARNESS_RESULTS_DIR}/stats.json
        metric: seed
      - name: regression_slope
        source: ${HARNESS_RESULTS_DIR}/stats.json
        metric: seed
    artifacts:
      - stats.json

  checklist:
    - name: assembled-flow
      run: ${HARNESS_PYTHON} scripts/demo_step.py --out "${HARNESS_RESULTS_DIR}/stats.json" --seed 42
      timeout: 120

  modules:
    - id: data-gen
      title: Generate the demo dataset
      depends_on: []
      deliverables:
        - tests/fixtures/demo-pipeline-spec.yaml
      contract:
        inputs:
          - name: seed
            type: int
            description: RNG seed
        outputs:
          - name: dataset
            type: path
            description: Output JSON file
      brief: |
        Implement `data_gen` module.
      constraints:
        - stdlib only
        - deterministic for a given seed
      checklist:
        - name: writes-the-dataset
          run: ${HARNESS_PYTHON} scripts/demo_step.py --out "${HARNESS_RESULTS_DIR}/demo_data.json" --seed 42
          timeout: 120

    - id: stats
      title: Compute summary statistics
      depends_on: [data-gen]
      deliverables:
        - tests/fixtures/configs/demo.yaml
      contract:
        inputs:
          - name: dataset
            type: path
            description: Output JSON
        outputs:
          - name: stats
            type: json
            description: JSON metrics
      brief: |
        Implement `stats` module.
      constraints:
        - stdlib only
      checklist:
        - name: writes-the-stats
          run: ${HARNESS_PYTHON} scripts/demo_step.py --out "${HARNESS_RESULTS_DIR}/stats.json" --seed 42
          timeout: 120
