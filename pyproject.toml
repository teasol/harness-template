[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-harness"
version = "0.7.0"
description = "Agent-first orchestration harness for reproducible research and automated verification"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
harness = "harness.cli:main"

# Listed rather than discovered, because one of them is not where its name says.
# `templates/` holds the files `harness init` copies into a project: not code, so
# not in the code's directory. A wheel can only carry data belonging to some
# package, so it installs as `harness_templates` beside `harness` — mapped here,
# and resolved at runtime by `harness.paths.template_root()`.
[tool.setuptools]
packages = [
    "harness",
    "harness.verify",
    "harness.orchestrate",
    "harness.handoff",
    "harness_templates",
]
package-dir = { harness_templates = "templates" }

[tool.setuptools.package-data]
harness_templates = ["gitignore", "*.md", "agents/*.md", "configs/*.yaml", "scripts/*.py"]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
