# Example orchestration plan — the Planner agent's output.
# A plan defines: the goal, a module DAG with IO contracts, a brief per
# module (the Worker's instructions), machine-checkable acceptance per
# module, and an integration spec verifying the assembled whole.
plan:
  name: demo-pipeline
  goal: >
    Build a deterministic stats pipeline: generate a seeded dataset, then
    compute summary statistics from it, and verify the assembled flow.
  description: >
    Two-module example demonstrating the two-tier harness: the Planner owns
    this file; Workers own one task file each (materialize with
    `python -m harness plan materialize plans/demo-pipeline.yaml`).

  # Verification of the ASSEMBLED pipeline — run once every module is done.
  integration:
    spec: configs/demo-pipeline.yaml

  modules:
    - id: data-gen
      title: Generate the demo dataset
      depends_on: []
      deliverables:
        - src/demo_pipeline/data_gen.py
      contract:
        inputs:
          - name: seed
            type: int
            description: RNG seed (determinism contract)
          - name: n
            type: int
            description: Number of rows to generate
        outputs:
          - name: dataset
            type: path
            description: CSV file with header `x,y` and n rows, y ≈ 2x + 1 + noise
      brief: |
        Implement `src/demo_pipeline/data_gen.py` as a runnable module:

        - `python -m demo_pipeline.data_gen --out PATH --seed SEED [--n N]`
        - Rows are generated with `random.Random(seed)` (Mersenne Twister,
          stable across platforms): x ~ uniform(0, 100),
          y = 2x + 1 + gauss(0, 5), both rounded to 6 decimals.
        - The CSV must have the exact header `x,y` (no index column).
        - Create parent directories of --out if missing.
        - Exit code 0 on success.

        Do not implement or modify any other module.
      constraints:
        - stdlib only (no third-party dependencies)
        - deterministic for a given seed
      acceptance:
        steps:
          - id: run-data-gen
            run: python -m demo_pipeline.data_gen --out "${HARNESS_RESULTS_DIR}/demo_data.csv" --seed 42
            timeout: 120
            checks:
              - type: file_exists
                path: ${HARNESS_RESULTS_DIR}/demo_data.csv
              - type: text_contains
                path: ${HARNESS_RESULTS_DIR}/demo_data.csv
                contains: ["x,y"]

    - id: stats
      title: Compute summary statistics
      depends_on: [data-gen]
      deliverables:
        - src/demo_pipeline/stats.py
      contract:
        inputs:
          - name: dataset
            type: path
            description: CSV with header `x,y` (output of the data-gen module)
        outputs:
          - name: stats
            type: json
            description: >
              JSON with keys n, x_mean, y_mean, x_std, y_std, slope,
              intercept (least-squares fit of y on x)
      brief: |
        Implement `src/demo_pipeline/stats.py` as a runnable module:

        - `python -m demo_pipeline.stats --input CSV --out JSON`
        - Read the CSV (header `x,y`); raise ValueError on any other header.
        - Compute n, means, population std/mean, and the least-squares line
          y = slope*x + intercept. Round all floats to 6 decimals.
        - Write pretty-printed JSON to --out; create parent dirs.
        - Exit code 0 on success.

        Consume the data-gen module only through its contract (a CSV path).
        Do not reimplement dataset generation in your acceptance; call the
        dependency's CLI. Do not implement or modify any other module.
      constraints:
        - stdlib only
        - must not import demo_pipeline.data_gen (contract-level reuse only)
      acceptance:
        steps:
          - id: prepare-input
            run: python -m demo_pipeline.data_gen --out "${HARNESS_RESULTS_DIR}/demo_data.csv" --seed 42
            timeout: 120
          - id: run-stats
            run: python -m demo_pipeline.stats --input "${HARNESS_RESULTS_DIR}/demo_data.csv" --out "${HARNESS_RESULTS_DIR}/stats.json"
            timeout: 120
            checks:
              - type: file_exists
                path: ${HARNESS_RESULTS_DIR}/stats.json
              - type: json_metric
                path: ${HARNESS_RESULTS_DIR}/stats.json
                metric: n
                equals: 100
              - type: json_metric
                path: ${HARNESS_RESULTS_DIR}/stats.json
                metric: x_mean
                min: 45
                max: 50
              - type: json_metric
                path: ${HARNESS_RESULTS_DIR}/stats.json
                metric: slope
                min: 1.9
                max: 2.1
