name: Verification

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly determinism canary

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verification spec
        run: python -m harness verify --spec configs/demo.yaml --results-dir results/verify

      # Runs the spec twice and diffs a manifest of every artifact it wrote.
      # Fails on any divergence, and refuses to "pass" a spec that produces
      # nothing to compare.
      - name: Determinism gate
        run: python -m harness reproduce --spec configs/demo.yaml --times 2

      - name: Plan validity + task/plan drift
        run: |
          python -m harness plan validate plans/demo-pipeline.yaml
          python -m harness plan status plans/demo-pipeline.yaml --check

      # Every task claiming 'done' must still pass its acceptance and produce
      # its declared deliverables. Iterates the board, so new tasks are gated
      # automatically without editing this workflow.
      - name: Completed tasks still pass acceptance
        run: python -m harness task verify --all --status done --results-dir results/tasks

      - name: Integration spec
        run: python -m harness verify --spec configs/demo-pipeline.yaml --results-dir results/pipeline

      # The experiment layer creates real branches and worktrees, so exercise
      # it against a throwaway clone rather than the checkout itself.
      # The retry loop itself is covered by tests/test_worker.py (a shell
      # command stands in for a coding agent — no model, network, or API key).
      # Here we smoke-test the shipped default: the manual adapter must write a
      # usable briefing and exit 1, since the work is not done.
      - name: Worker adapter (default path)
        run: |
          set +e
          python -m harness task run --id data-gen --results-dir results/worker
          code=$?
          set -e
          test "$code" = "1" || { echo "expected exit 1 (needs_human), got $code"; exit 1; }
          test -s results/worker/workers/data-gen/brief.md
          grep -q "Definition of done" results/worker/workers/data-gen/brief.md

      - name: Experiment lifecycle (worktree isolation + report)
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          python -m harness exp start ci-smoke
          python -m harness exp list
          python -m harness exp remove ci-smoke --force

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-reports
          path: |
            results/**/report.json
            results/**/report.md
            results/**/reproduce.json
          if-no-files-found: ignore
          retention-days: 14
