name: Verification

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly determinism canary

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verification spec
        run: python -m harness verify --spec tests/fixtures/configs/demo.yaml --results-dir results/verify

      # Runs the spec twice and diffs a manifest of every artifact it wrote.
      # Fails on any divergence, and refuses to "pass" a spec that produces
      # nothing to compare.
      - name: Determinism gate
        run: python -m harness reproduce --spec tests/fixtures/configs/demo.yaml --times 2

      # Names no plan, so it keeps gating a project whose plans have changed.
      - name: Plan validity + task/plan drift
        run: python -m harness plan check

      # Every task claiming 'done' must still pass its acceptance and produce
      # its declared deliverables. Iterates the board, so new tasks are gated
      # automatically without editing this workflow.
      - name: Completed tasks still pass acceptance
        run: python -m harness task verify --all --status done --results-dir results/tasks

      # Two steps stood here: the demo-pipeline integration spec and a smoke
      # test of the shipped `data-gen` task. Both were removed from the
      # repository in a964912 but left in this workflow, so every run since
      # has failed on files that no longer exist. The Worker adapter and its
      # retry loop are covered by tests/test_worker.py and tests/test_guard.py,
      # where a shell command stands in for a coding agent — no model, no
      # network, no API key.

      - name: Plan lifecycle (worktree isolation + report)
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          python -m harness plan new ci-smoke --planner ci
          python -m harness plans
          python -m harness plan drop ci-smoke --force

      # A plan survives the machine it was started on: dropping the worktree
      # keeps the branch, and `plan resume` is how the next session gets a
      # working copy back. Exercised here because the failure mode is silent —
      # a plan with no worktree used to look like no plan at all.
      - name: Handoff and resume (the session changed, not the work)
        run: |
          python -m harness plan resume ci-smoke
          python -m harness plans
          python -m harness create -n ci --model ci-model --effort low
          python -m harness note "ci smoke: nothing learned"
          python -m harness note "ci smoke: nothing failed" --dead-end
          python -m harness handoff --next "ci smoke"
          python -m harness handoff --show
          test -f HANDOFF.md
          grep -q "nothing failed" HANDOFF.md
          python -m harness plan drop ci-smoke --force

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-reports
          path: |
            results/**/report.json
            results/**/report.md
            results/**/reproduce.json
          if-no-files-found: ignore
          retention-days: 14
