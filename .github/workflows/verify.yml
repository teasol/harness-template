name: Verification

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly determinism canary

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verification spec
        run: python -m harness verify --spec configs/demo.yaml --results-dir results/verify

      # Runs the spec twice and diffs a manifest of every artifact it wrote.
      # Fails on any divergence, and refuses to "pass" a spec that produces
      # nothing to compare.
      - name: Determinism gate
        run: python -m harness reproduce --spec configs/demo.yaml --times 2

      - name: Plan validity + task/plan drift
        run: |
          python -m harness plan validate plans/demo-pipeline.yaml
          python -m harness plan status plans/demo-pipeline.yaml --check

      # Every task claiming 'done' must still pass its acceptance and produce
      # its declared deliverables. Iterates the board, so new tasks are gated
      # automatically without editing this workflow.
      - name: Completed tasks still pass acceptance
        run: python -m harness task verify --all --status done --results-dir results/tasks

      - name: Integration spec
        run: python -m harness verify --spec configs/demo-pipeline.yaml --results-dir results/pipeline

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-reports
          path: |
            results/**/report.json
            results/**/report.md
            results/**/reproduce.json
          if-no-files-found: ignore
          retention-days: 14
