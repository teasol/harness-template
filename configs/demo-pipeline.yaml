# Integration spec for plans/demo-pipeline.yaml — verifies the ASSEMBLED
# pipeline once every module task is done. This is the Planner's final gate.
name: demo-pipeline
description: Integration check — assembled two-module demo pipeline
seed: 42

steps:
  - id: generate-dataset
    run: python -m demo_pipeline.data_gen --out "${HARNESS_RESULTS_DIR}/demo_data.csv" --seed 42
    timeout: 120
    checks:
      - type: file_exists
        path: ${HARNESS_RESULTS_DIR}/demo_data.csv

  - id: compute-stats
    run: python -m demo_pipeline.stats --input "${HARNESS_RESULTS_DIR}/demo_data.csv" --out "${HARNESS_RESULTS_DIR}/stats.json"
    timeout: 120
    checks:
      - type: json_metric
        path: ${HARNESS_RESULTS_DIR}/stats.json
        metric: n
        equals: 100
      - type: json_metric
        path: ${HARNESS_RESULTS_DIR}/stats.json
        metric: slope
        min: 1.9
        max: 2.1
      - type: json_metric
        path: ${HARNESS_RESULTS_DIR}/stats.json
        metric: intercept
        min: -1
        max: 1
