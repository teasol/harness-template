# Which agent runs each tier. `harness setup` writes this; edit it freely.
#
# Two tiers, side by side so the split is visible:
#
#   planner — Tier 2. Decomposes the goal, judges the whole. The reasoning
#             happens here, so this is where an expensive model earns its cost.
#   worker  — Tier 3. Builds one fully-specified module against machine-checked
#             acceptance. Bounded work; a small fast model usually suffices.
#
# A tier you cannot choose is not a tier, which is why model and reasoning
# level are explicit rather than whatever a tool happens to default to.
#
# adapter:
#   manual — you open that session yourself; the harness writes a briefing
#            and stops. The default, so the template needs no API key.
#   cli    — the harness spawns it: `harness planner run` for the Planner,
#            `harness plan run` for Workers.
#
# session: attach an already-open session instead of starting a fresh one —
#          useful when a researcher has a Planner conversation going already.
#
# Placeholders: {model} {effort} {session} {root} {brief_file}
#               {task_file} {task_id} {experiment}
#
# Run `harness setup` to fill this in from the presets in
# configs/agent-platforms.yaml.
planner:
  adapter: cli
  platform: antigravity
  model: gemini-3.7-flash
  effort: high
  command: agy -p --model {model} --effort {effort} --dangerously-skip-permissions --add-dir {root}
  resume_command: agy -p --continue --model {model} --effort {effort} --dangerously-skip-permissions --add-dir {root}
  attempts: 3
  timeout: 1800
  label: planner

worker:
  adapter: cli
  platform: antigravity
  model: gemini-3.7-flash
  effort: low
  command: agy -p --model {model} --effort {effort} --dangerously-skip-permissions --add-dir {root}
  resume_command: agy -p --continue --model {model} --effort {effort} --dangerously-skip-permissions --add-dir {root}
  attempts: 6
  timeout: 1800
  label: worker

