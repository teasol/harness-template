# How a Planner invokes a Worker (Tier 2 -> Tier 3).
#
# The harness names no vendor: the command is YOUR configuration, so point it
# at whichever coding agent — or local model — your lab already uses. Swapping
# tools is an edit here, not a change to the harness.
#
# The briefing is passed on stdin. These placeholders are also available in the
# command string: {task_id} {task_file} {brief_file} {root}
worker:
  # manual  — write the briefing to a file and stop, for a human to hand to a
  #           Worker session. The default: works with no config and no API key.
  # cli     — run a coding agent in headless/non-interactive mode.
  adapter: manual

  # Example for `adapter: cli` — replace with your tool's non-interactive
  # invocation. It must read the briefing from stdin, edit files under {root},
  # and exit when finished.
  #
  # command: "<your-coding-agent> --non-interactive --cwd {root}"
  #
  # Optional: used from the second attempt on. If your tool can continue an
  # existing session, use that here — resuming preserves the worker's context,
  # which is why retries are usually cheaper than starting over.
  #
  # resume_command: "<your-coding-agent> --continue --non-interactive --cwd {root}"

  # A coding agent handed its own failing test usually fixes it, so retrying
  # the same worker beats restarting. Capped so a wedged worker cannot burn
  # budget forever; on exhaustion the task is blocked for the Planner.
  attempts: 6

  # Seconds per attempt.
  timeout: 1800

  # Recorded in the task log and the board.
  label: worker
